<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostingTemplateSite | Next-Gen Hosting</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #05070a;
            --card-bg: #0d1117;
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.3);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --accent: #818cf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            /* FIX: Prevents the "wobble" or horizontal scroll on mobile */
            overflow-x: hidden; 
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            min-height: 80px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(5, 7, 10, 0.8);
            padding: 10px 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -1px;
            white-space: nowrap;
            /* FIX: Prevent logo from squishing on small screens */
            flex-shrink: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 24px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--primary); }

        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            white-space: nowrap;
            display: inline-block;
            font-size: 0.9rem;
        }

        .hero {
            padding: 100px 0 60px;
            text-align: center;
            position: relative;
        }

        .hero-glow {
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            height: 500px;
            background: var(--primary-glow);
            filter: blur(100px);
            z-index: -1;
            border-radius: 50%;
        }

        .badge {
            background: rgba(79, 70, 229, 0.1);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.8rem;
            border: 1px solid rgba(79, 70, 229, 0.2);
            font-weight: 600;
        }

        h1 {
            /* FIX: Uses clamp to scale between 2.2rem and 4.5rem based on screen width */
            font-size: clamp(2.2rem, 8vw, 4.5rem);
            font-weight: 800;
            margin-top: 24px;
            letter-spacing: -2px;
            line-height: 1.1;
        }

        .gradient-text {
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: clamp(1rem, 4vw, 1.2rem);
            max-width: 650px;
            margin: 24px auto 40px;
        }

        .pricing-section { padding: 40px 0 80px; }
        
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        /* Responsive adjustment for very small screens */
        @media (max-width: 350px) {
            .pricing-grid {
                grid-template-columns: 1fr;
            }
        }
